
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="navbar">
        <h1>ShopEasy</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            oninput="searchProducts()"
        >

        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#" onclick="showOrders()">My Orders</a>
            <a href="#" onclick="showCart()">
                Cart (<span id="cartCount">0</span>)
            </a>
        </nav>
    </div>
</header>

<section class="hero">
    <h2>Welcome to ShopEasy!</h2>
    <p>Find your favourite products at the best prices.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
</section>

<main>
    <section id="products">
        <h2>Our Products</h2>
        <div id="productList" class="product-grid">
            Loading products...
        </div>
    </section>

    <section id="cartSection" class="hidden">
        <h2>Shopping Cart</h2>
        <div id="cartItems"></div>
        <h3 id="cartTotal">Total: ₹0</h3>

        <input
            type="text"
            id="customerName"
            placeholder="Enter your name"
        >

        <button onclick="checkout()">Place Order</button>
        <button onclick="closeCart()">Continue Shopping</button>
    </section>

    <section id="ordersSection" class="hidden">
        <h2>My Orders</h2>
        <div id="ordersList"></div>
        <button onclick="closeOrders()">Back to Shopping</button>
    </section>
</main>

<footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
